[project]
name = "automations"
version = "0.1.0"
description = "Notion, Spotify and F1 data automations for the pumpkio9 portfolio site"
readme = "scripts/README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "notion-client>=3.0.0",
    "pydantic>=2.14.3",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
addopts = "--strict-markers"
markers = ["unit: fast tests with no network"]
