# PLACEHOLDER template: there is no backend service yet (see docs/roadmap.md),
# and no workflow deploys this. The image below is not a real image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speeddemon-deployment
  labels:
    app: speeddemon-app       # Must match the selector in k8s-service.yml
spec:
  replicas: 3
  selector:
    matchLabels:
      app: speeddemon-app
  template:
    metadata:
      labels:
        app: speeddemon-app
    spec:
      containers:
      - name: backend
        # PLACEHOLDER: replace with a real registry path
        image: your-dockerhub-user/speeddemon:latest
        ports:
        - containerPort: 8000

        envFrom:
          - secretRef:
              name: app-secrets

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
