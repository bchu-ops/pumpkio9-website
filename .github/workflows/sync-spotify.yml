name: Sync Spotify listening

# Pulls Brian's listening data into frontend/public/spotify/listening.json.
# Commits only when the data changed, then triggers a Pages deploy.
on:
  schedule:
    - cron: '17 * * * *'  # hourly; GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-spotify
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Fetch listening data
        working-directory: ./backend/automations
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: uv run python scripts/sync_spotify.py

      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- frontend/public/spotify)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/spotify/listening.json
          git commit -m "chore: sync Spotify listening data"
          # Someone may have pushed since checkout; replay on top and retry once.
          git push || { git pull --rebase origin "$GITHUB_REF_NAME" && git push; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the deploy explicitly.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
