name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # manual trigger from the Actions tab
  schedule:
    # Hourly rebuild: fresh Spotify listening data each run; the F1 snapshot
    # cache is keyed by date, so OpenF1 is only fetched once a day.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# A scheduled run can overlap a push or a Promote; queue them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Vite 8 needs Node 20.19+ / 22.12+

      # 3. Navigate to frontend folder
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # Speed Demon: reuse today's F1 snapshot if a run already made one.
      - name: Date key for F1 snapshot
        id: f1date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore F1 snapshot
        id: f1cache
        uses: actions/cache@v4
        with:
          path: frontend/public/f1
          key: f1-snapshot-${{ steps.f1date.outputs.day }}
          restore-keys: f1-snapshot-

      # Free OpenF1 API, ~7 min for 2 race weekends. Never fails the deploy:
      # the site falls back to the live API for anything not cached.
      - name: Prefetch F1 snapshot
        if: steps.f1cache.outputs.cache-hit != 'true'
        working-directory: ./backend/automations
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/prefetch-f1.mjs --meetings 2

      # Spotify: build-time snapshot into frontend/public/spotify (not committed,
      # so nothing ever commits to main outside the dev -> main flow).
      # Never fails the deploy: without secrets the page shows its empty state.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Fetch Spotify listening data
        working-directory: ./backend/automations
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}  # public, so a variable
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [ -z "$SPOTIFY_REFRESH_TOKEN" ]; then
            echo "::notice::Spotify secrets not set; skipping (Spotify page shows its empty state)"
            exit 0
          fi
          uv run python scripts/sync_spotify.py

      # 4. Lint and test (site + products/*/web)
      - name: Lint and test
        working-directory: ./frontend
        run: npm run lint && npm test

      # 5. Build frontend (Vite; imports product pages from ../products)
      - name: Build frontend
        working-directory: ./frontend
        env:
          # Public by design (PKCE login needs no secret). Set under
          # Settings > Secrets and variables > Actions > Variables.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: npm run build

      # 6. Upload build output as artifact
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build   # build output folder

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
