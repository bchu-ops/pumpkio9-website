name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main  # or master
  workflow_dispatch:   # 👈 Allows manual trigger from Actions tab
  schedule:
    # Daily rebuild so Speed Demon's F1 snapshot picks up new race weekends.
    - cron: '23 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# The Spotify sync can start a deploy while a push starts another.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. Navigate to frontend folder
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # Speed Demon: reuse today's F1 snapshot if a run already made one.
      - name: Date key for F1 snapshot
        id: f1date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore F1 snapshot
        id: f1cache
        uses: actions/cache@v4
        with:
          path: frontend/public/f1
          key: f1-snapshot-${{ steps.f1date.outputs.day }}
          restore-keys: f1-snapshot-

      # Free OpenF1 API, ~7 min for 2 race weekends. Never fails the deploy:
      # the site falls back to the live API for anything not cached.
      - name: Prefetch F1 snapshot
        if: steps.f1cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/prefetch-f1.mjs --meetings 2

      # 4. Build frontend
      - name: Build frontend
        working-directory: ./frontend
        env:
          # Public by design (PKCE login needs no secret). Set under
          # Settings > Secrets and variables > Actions > Variables.
          REACT_APP_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: npm run build

      # 5. Upload build output as artifact
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build   # build output folder

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

