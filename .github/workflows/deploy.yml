name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main  # or master
  workflow_dispatch:   # 👈 Allows manual trigger from Actions tab


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. Navigate to frontend folder
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # 4. Build frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 5. Deploy build folder to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Provided automatically
          publish_dir: ./frontend/build
          publish_branch: gh-pages        # Explicitly push to gh-pages branch
          # Optional:
          # user_name: "Brian Chu"
          # user_email: "brian.chu1030@gmail.com"
          # commit_message: "Auto deploy via GitHub Actions"