version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]

  # uv (not pip): the project is pyproject.toml + uv.lock with dependency groups.
  - package-ecosystem: uv
    directory: /backend/automations
    target-branch: dev
    schedule:
      interval: monthly
